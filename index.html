<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b557c"><link rel="manifest" href="manifest.webmanifest"><title>Minha Skincare</title><style>body{margin:0;background:#faf7fb;color:#292333;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#6b557c;color:white;padding:24px 18px}main{max-width:650px;margin:auto;padding:16px}h1{font-size:25px;margin:0}h2{font-size:19px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 13px;background:#6b557c;color:white;cursor:pointer}.secondary{background:#ece5f1;color:#392d43}.card{background:white;border:1px solid #e8dfeb;border-radius:16px;padding:15px;margin:13px 0;box-shadow:0 2px 8px #25112d09}.tabs,.days{display:flex;gap:5px;overflow:auto}.tabs button,.days button{flex:1;min-width:44px;padding:10px 5px}.active{background:#372944!important;color:white!important}.muted{color:#756c7a;font-size:13px}.step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.step input{width:21px;height:21px;accent-color:#6b557c}.warning{background:#fff4dc;border-left:4px solid #d99526;padding:12px;border-radius:8px;margin:10px 0}.ok{background:#e8f5ed;padding:12px;border-radius:8px}label{display:block;font-size:14px;margin:10px 0 4px}input[type=text],select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cfc5d4;border-radius:9px;background:white}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline button{padding:8px}.pill{background:#f1ebf4;padding:5px 9px;border-radius:30px;font-size:12px}nav{display:flex;gap:8px;margin:12px 0}nav button{flex:1}small{color:#756c7a} .hidden{display:none}</style></head><body><header><h1>✿ Minha Skincare</h1><div>Rotina simples, cuidados conscientes</div></header><main><nav><button id="navRoutine" onclick="view='routine';render()">Rotinas</button><button id="navProducts" class="secondary" onclick="view='products';render()">Produtos</button><button id="navBackup" class="secondary" onclick="view='backup';render()">Backup</button></nav><section id="routine"></section><section id="products" class="hidden"></section><section id="backup" class="hidden"></section><p class="muted">Os alertas são orientações conservadoras, não diagnósticos. Observe a tolerância da pele e siga as instruções do fabricante. Evite retinoides na gravidez ou ao tentar engravidar.</p></main><script>
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const initial=[{id:'cam',name:'Sabonete facial de camomila',act:'limpeza'},{id:'hid',name:'Hidratante rosa mosqueta + niacinamida',act:'hidratante'},{id:'fps',name:'Protetor solar FPS 50+',act:'protetor'},{id:'ret',name:'Retinol Noturno',act:'retinoide'},{id:'shot',name:'Retinal Shot',act:'retinoide'},{id:'gly',name:'Tônico ácido glicólico',act:'acido'},{id:'pep',name:'Illumine Peptídeo Mask',act:'mascara'},{id:'car',name:'Máscara carvão 3 em 1',act:'esfoliante'}];const base={};for(let d=0;d<7;d++){base[d+'-day']=['cam','hid','fps'];base[d+'-night']=d===1||d===5?['cam','ret','hid']:d===3?['cam','gly','hid']:d===6?['cam','pep','hid']:['cam','hid']};let products=read('skin-products',initial),schedule=read('skin-schedule',base),done=read('skin-done',{}),day=new Date().getDay(),period='day',view='routine';function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){localStorage.setItem('skin-products',JSON.stringify(products));localStorage.setItem('skin-schedule',JSON.stringify(schedule));localStorage.setItem('skin-done',JSON.stringify(done))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function conflicts(ids){const a=ids.map(id=>products.find(p=>p.id===id)?.act);let out=[];if(a.filter(x=>x==='retinoide').length>1)out.push('Dois retinoides na mesma rotina: escolha apenas um.');if(a.includes('retinoide')&&a.includes('acido'))out.push('Retinoide e ácido glicólico juntos aumentam o risco de irritação: prefira noites separadas.');if(a.includes('esfoliante')&&(a.includes('acido')||a.includes('retinoide')))out.push('Máscara esfoliante junto de ácido ou retinoide: prefira dias separados.');if(period==='day'&&a.includes('retinoide'))out.push('Retinoides: prefira o uso noturno conforme o rótulo.');return out}function changeDay(d){day=d;render()}function changePeriod(p){period=p;render()}function localDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function toggle(id){let key=localDate()+'-'+day+'-'+period+'-'+id;done[key]=!done[key];save();render()}function addToRoutine(id){const key=day+'-'+period;let list=schedule[key]||[];schedule[key]=list.includes(id)?list.filter(x=>x!==id):[...list,id];save();render()}function render(){document.getElementById('routine').classList.toggle('hidden',view!=='routine');document.getElementById('products').classList.toggle('hidden',view!=='products');document.getElementById('backup').classList.toggle('hidden',view!=='backup');document.getElementById('navRoutine').className=view==='routine'?'':'secondary';document.getElementById('navProducts').className=view==='products'?'':'secondary';document.getElementById('navBackup').className=view==='backup'?'':'secondary';if(view==='backup'){document.getElementById('backup').innerHTML=`<h2>Backup dos seus dados</h2><div class="card"><p>Exporte seus produtos, rotinas e checklists para um arquivo JSON. Guarde no Arquivos ou iCloud Drive.</p><button onclick="exportBackup()">Exportar backup</button></div><div class="card"><h3>Restaurar backup</h3><p class="muted">A restauração substitui os dados atuais. Faça uma exportação antes.</p><input id="backupFile" type="file" accept=".json,application/json"><p><button onclick="importBackup()">Restaurar arquivo</button></p></div>`;return}if(view==='products'){document.getElementById('products').innerHTML=`<h2>Meus produtos</h2><div class="card">${products.map(p=>`<div class="step"><span style="flex:1"><b>${esc(p.name)}</b><br><small>${esc(p.act)}</small></span><button class="secondary" onclick="removeProduct('${p.id}')">Excluir</button></div>`).join('')}</div><div class="card"><h2>Novo produto</h2><label>Nome</label><input id="pname" type="text" placeholder="Nome do produto"><label>Categoria / ativo</label><select id="pact"><option value="limpeza">Limpeza</option><option value="hidratante">Hidratante</option><option value="protetor">Protetor solar</option><option value="retinoide">Retinol / retinal</option><option value="acido">Ácido esfoliante (AHA/BHA)</option><option value="esfoliante">Máscara esfoliante</option><option value="mascara">Máscara não esfoliante</option><option value="outro">Outro</option></select><p><button onclick="addProduct()">Cadastrar produto</button></p></div>`;return}let key=day+'-'+period,ids=schedule[key]||[],warnings=conflicts(ids);document.getElementById('routine').innerHTML=`<h2>Calendário semanal</h2><div class="days">${DAYS.map((d,i)=>`<button class="${day===i?'active':'secondary'}" onclick="changeDay(${i})">${d}</button>`).join('')}</div><div class="card"><div class="tabs"><button class="${period==='day'?'active':'secondary'}" onclick="changePeriod('day')">☀️ Diurna</button><button class="${period==='night'?'active':'secondary'}" onclick="changePeriod('night')">🌙 Noturna</button></div><h2>${DAYS[day]} · ${period==='day'?'Manhã':'Noite'}</h2>${ids.map((id,i)=>{let p=products.find(x=>x.id===id);if(!p)return '';let ck=localDate()+'-'+day+'-'+period+'-'+id;return `<div class="step"><input type="checkbox" ${done[ck]?'checked':''} onchange="toggle('${id}')"><span style="flex:1">${i+1}. ${esc(p.name)}</span><button class="secondary" onclick="addToRoutine('${id}')" aria-label="Remover">×</button></div>`}).join('')||'<p>Sem produtos nesta rotina.</p>'}<h3>Adicionar produto</h3><select id="addselect"><option value="">Selecione um produto</option>${products.filter(p=>!ids.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><p><button onclick="let v=document.getElementById('addselect').value;if(v)addToRoutine(v)">Adicionar à rotina</button></p>${warnings.length?warnings.map(w=>`<div class="warning">⚠️ ${w}</div>`).join(''):'<div class="ok">✓ Nenhum conflito previsto nas regras cadastradas. Isso não garante ausência de irritação.</div>'}</div><p class="muted">Você pode editar a programação de cada dia e período. O checklist é registrado no aparelho.</p>`}function exportBackup(){const data={format:'minha-skincare-backup',version:1,exportedAt:new Date().toISOString(),products,schedule,done};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='minha-skincare-backup-'+localDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(){const f=document.getElementById('backupFile').files[0];if(!f)return alert('Selecione um arquivo JSON.');if(f.size>2000000)return alert('Arquivo muito grande.');try{const data=JSON.parse(await f.text());if(data.format!=='minha-skincare-backup'||data.version!==1||!Array.isArray(data.products)||!data.schedule||typeof data.schedule!=='object'||Array.isArray(data.schedule)||!data.done||typeof data.done!=='object'||Array.isArray(data.done)||!data.products.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&typeof p.act==='string')||!Object.values(data.schedule).every(v=>Array.isArray(v)&&v.every(id=>typeof id==='string')))throw Error('Formato inválido');if(!confirm('Substituir todos os dados atuais pelos dados deste backup?'))return;products=data.products;schedule=data.schedule;done=data.done;save();view='routine';render();alert('Backup restaurado com sucesso.')}catch(e){alert('Não foi possível restaurar: arquivo inválido ou incompatível.')}}function addProduct(){let name=document.getElementById('pname').value.trim(),act=document.getElementById('pact').value;if(!name)return alert('Informe o nome.');products.push({id:'p'+Date.now(),name,act});save();render()}function removeProduct(id){if(!confirm('Excluir este produto das rotinas?'))return;products=products.filter(p=>p.id!==id);Object.keys(schedule).forEach(k=>schedule[k]=schedule[k].filter(x=>x!==id));save();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
